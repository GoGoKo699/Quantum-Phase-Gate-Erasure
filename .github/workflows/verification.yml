name: Scientific verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact finite cases
        run: python3 -B -m unittest discover -s verification -v
